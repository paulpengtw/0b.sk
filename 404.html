<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <script>
        const apiUrl = 'https://script.google.com/macros/s/AKfycbzqQPnCUZKGYqmWGVFgOGDEtN_sSGhAYH3-7Zg6_HtNLHh3gbxgJbMiw_XDy_6SYyFi/exec';
        
        window.onload = function() {
            const path = window.location.pathname.replace('/', '');
            
            if (path) {
                fetch(apiUrl)
                    .then(response => response.json())
                    .then(data => {
                        const match = data.find(row => row.shortcode === path);
                        if (match) {
                            window.location.href = match.destination_url;
                        } else {
                            document.body.innerHTML = 'Shortcode not found';
                        }
                    })
                    .catch(error => {
                        document.body.innerHTML = 'Redirect Error';
                    });
            }
        };
    </script>
</head>
<body>
    Redirecting...
</body>
</html>
